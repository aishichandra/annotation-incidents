<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident coder</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="bar">
  <div class="viewtabs">
    <button id="tabIncidents" class="tab active">Incidents</button>
    <button id="tabDocs" class="tab">Documents</button>
  </div>
  <label class="coderpick" title="Whose coding you are viewing and editing. Each coder's work is saved separately.">
    Coding as <select id="coderSelect"></select>
  </label>
  <select id="docSelect"></select>
  <button id="pushBtn" class="pull" title="Push all local coding + claim groups up to MongoDB">Push to Mongo</button>
  <button id="pullBtn" class="pull" title="Overwrite local annotations with the copy in MongoDB (Mongo wins)">Pull from Mongo</button>
  <span class="hint" id="armHint"></span>
  <span class="status" id="status"></span>
</div>

<!-- By-incident view: one card per incident, populated from /api/incidents -->
<div id="incidents"></div>

<div class="app">
  <div class="reader">
    <div class="doctitle" id="docTitle">Loading…</div>
    <a class="docurl" id="docUrl" target="_blank" rel="noopener"></a>
    <div id="text"></div>
  </div>
  <div class="side"><div id="form"></div></div>
</div>

<!-- overlay for arrows connecting a claim's highlighted characteristics -->
<svg id="arrows" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"></path>
    </marker>
  </defs>
  <g id="arrowLines"></g>
</svg>


<!--
  Scripts load in order and share one global scope, exactly as they did when
  this was a single inline <script>. Order matters: 80-persist.js calls init()
  on the last line, so it stays last.

    00-coder.js       coder picker; the fetch wrapper that attributes /api/ calls
    10-state.js       SCHEMA, curDoc, ROLES, colors, role-option helpers, arm state
    20-init.js        init() bootstrap, tab switching + scroll restore
    30-incidents.js   incidents view: cards, palette, claim groups, quote panels
    40-mongo-sync.js  push to / pull from Mongo, incident id + title lookups
    50-reader.js      document view: markdown render, highlight lanes, span menus
    60-form.js        coding form: cards, selects, text fields, evidence lists
    70-arming.js      armed-field styling and hints; roles panel
    80-persist.js     debounced save, escapeHtml, outside-click close, init()
-->
<script src="{{ url_for('static', filename='js/00-coder.js') }}"></script>
<script src="{{ url_for('static', filename='js/10-state.js') }}"></script>
<script src="{{ url_for('static', filename='js/20-init.js') }}"></script>
<script src="{{ url_for('static', filename='js/30-incidents.js') }}"></script>
<script src="{{ url_for('static', filename='js/40-mongo-sync.js') }}"></script>
<script src="{{ url_for('static', filename='js/50-reader.js') }}"></script>
<script src="{{ url_for('static', filename='js/60-form.js') }}"></script>
<script src="{{ url_for('static', filename='js/70-arming.js') }}"></script>
<script src="{{ url_for('static', filename='js/80-persist.js') }}"></script>
</body>
</html>
