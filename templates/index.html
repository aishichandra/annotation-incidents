<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident coder</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="bar">
  <div class="viewtabs">
    <button id="tabIncidents" class="tab active">Incidents</button>
    <button id="tabDocs" class="tab">Documents</button>
    <button id="tabCodebook" class="tab">Codebook</button>
  </div>
  <label class="coderpick" title="Whose coding you are viewing and editing. Each coder's work is saved separately.">
    Coding as <select id="coderSelect"></select>
  </label>
  <select id="docSelect"></select>
  <button id="pushBtn" class="pull" title="Push all local coding + claim groups up to MongoDB">Push to Mongo</button>
  <button id="pullBtn" class="pull" title="Overwrite local annotations with the copy in MongoDB (Mongo wins)">Pull from Mongo</button>
  <span class="hint" id="armHint"></span>
  <span class="status" id="status"></span>
</div>

<!-- By-incident view: one card per incident, populated from /api/incidents -->
<div id="incidents"></div>

<!-- The coding scheme itself: categories and their definitions, from /api/vocab -->
<div id="codebook"></div>

<div class="app">
  <div class="reader">
    <div class="doctitle" id="docTitle">Loading…</div>
    <a class="docurl" id="docUrl" target="_blank" rel="noopener"></a>
    <div id="text"></div>
  </div>
  <div class="side"><div id="form"></div></div>
</div>

<!-- overlay for arrows connecting a claim's highlighted characteristics -->
<svg id="arrows" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"></path>
    </marker>
  </defs>
  <g id="arrowLines"></g>
</svg>


<!--
  One module is loaded; the browser follows the imports from there. Each file
  says at the top what it needs from the others, so load order is not something
  this file has to get right, and nothing shares a global scope.

    main.js       the entry point: side-effect modules, then init()
    coder.js      the coder picker, and the fetch wrapper that attributes calls
    state.js      the scheme, the current document, colours, definitions, arming
    boot.js       init() and the three view tabs
    reader.js     document view: markdown, highlight lanes, span menus
    form.js       the coding form: cards, selects, text answers, evidence
    arming.js     which field a highlight will land in; the roles panel
    codebook.js   the Codebook tab: the codes and what they mean
    sync.js       Push and Pull
    persist.js    debounced save, escapeHtml, outside-click close

    incidents/index.js    the tile index, the tabs, opening one incident
    incidents/card.js     what a card shows
    incidents/palette.js  pooled characteristics, and the evidence behind them
    incidents/claims.js   claim groups, and the drops that build them
    incidents/fields.js   Geography and Translated, answered on the card
    incidents/signoff.js  complete, not an incident, unsure
    incidents/comment.js  the per-incident comment box
    incidents/json.js     the incident as it is stored
-->
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
