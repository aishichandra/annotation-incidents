<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident coder</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
    --rail: #f4f4f5; --accent: #2563eb; --bar-h: 52px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--fg); font: 15px/1.6 -apple-system, system-ui, sans-serif; }

  .bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h); z-index: 30;
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
    background: #fff; border-bottom: 1px solid var(--line); }
  .bar select { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; max-width: 560px; }
  .bar .pull { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: #555; cursor: pointer; white-space: nowrap; }
  .bar .pull:hover { border-color: #111; color: #111; }
  .bar .pull:disabled { opacity: .5; cursor: default; }
  .bar .status { color: var(--muted); font-size: 13px; margin-left: auto; }
  /* who is coding — always visible so nobody codes as the wrong person */
  .coderpick { display: flex; align-items: center; gap: 6px; flex: none;
    font-size: 12px; color: var(--muted); white-space: nowrap; }
  .coderpick select { font-size: 13px; padding: 5px 8px; }
  .bar .hint { color: var(--muted); font-size: 12px; }
  .viewtabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .viewtabs .tab { font: inherit; font-size: 13px; padding: 6px 14px; border: none;
    background: #fff; color: #666; cursor: pointer; }
  .viewtabs .tab + .tab { border-left: 1px solid var(--line); }
  .viewtabs .tab.active { background: #111; color: #fff; }

  /* ---- Incident (by-incident) view — styled after the Tow/CJR P+P tracker ---- */
  /* Brand: deep blue #254c6f, Tow orange #de5a35, hairline #e0e0e0, square cards,
     serif headlines, tiny uppercase gray field labels. */
  body.view-incidents .app, body.view-incidents #arrows,
  body.view-incidents #docSelect { display: none; }
  #incidents { display: none; }
  body.view-incidents #incidents { display: block; }
  #incidents { padding: calc(var(--bar-h) + 40px) 24px 100px; background: #f6f6f4;
    min-height: 100vh; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .inc-wrap { max-width: 1000px; margin: 0 auto; }
  .inc-pagehead { margin: 0 0 26px; padding-bottom: 16px; border-bottom: 2px solid #de5a35; }
  .inc-pagehead h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 30px;
    color: #254c6f; margin: 0 0 4px; font-weight: 700; letter-spacing: -.01em; }
  .inc-pagehead p { margin: 0; color: #6e6e6e; font-size: 13px; }
  .iempty { color: var(--muted); padding: 40px 4px; text-align: center; }

  .tow-card { background: #fff; border: 1px solid #e0e0e0; margin-bottom: 20px; }
  .tow-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 14px;
    padding: 14px 20px; background: #fafafa; border-bottom: 1px solid #e0e0e0; }
  .tow-id { font: 600 11px 'Helvetica Neue', Helvetica, sans-serif; text-transform: uppercase;
    letter-spacing: .06em; color: #254c6f; background: #eaf0f6; border: 1px solid #d6e0eb;
    padding: 3px 9px; border-radius: 3px; flex: none; }
  .tow-title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 700;
    color: #222; line-height: 1.25; flex: 1 1 260px; min-width: 0; }
  .tow-title-ph { color: #bbb; font-style: italic; font-weight: 400; }
  .tow-headdocs { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .tow-headdocs .tow-doc { margin-bottom: 0; }
  .tow-meta { font-size: 12px; color: #999; flex: none; }
  .tow-meta b { color: #444; font-weight: 600; }

  .tow-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 20px; }
  .tow-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .tow-col.c1 { padding-right: 22px; border-right: 1px solid #e0e0e0; }
  .tow-col.c2 { padding-left: 22px; }
  @media (max-width: 720px) {
    .tow-body { grid-template-columns: 1fr; gap: 18px; }
    .tow-col.c1 { padding-right: 0; border-right: none; border-bottom: 1px solid #e0e0e0;
      padding-bottom: 18px; }
    .tow-col.c2 { padding-left: 0; }
  }

  .tow-field { display: flex; flex-direction: column; gap: 5px; }
  .tow-label { font-size: 11px; font-weight: 400; text-transform: uppercase;
    letter-spacing: .06em; color: #999; }
  .tow-value { font-size: 14px; line-height: 1.5; color: #1a1a1a; word-break: break-word; }
  .tow-nodata { font-size: 13px; color: #b8b8b8; font-style: italic; }
  .tow-chip { display: inline-block; background: #f5f5f5; border: 1px solid #e0e0e0;
    color: #333; padding: 3px 9px; border-radius: 3px; font-size: 13px; font-weight: 500;
    margin: 0 5px 5px 0; }
  .tow-comment { font-size: 12px; color: #6e6e6e; font-style: italic; margin-top: 3px; }
  /* System / Developer values — same field block, but the chips drag into the
     claim sentence's optional clauses */
  .tow-dragfield { display: flex; flex-wrap: wrap; gap: 7px; }

  /* Drag-to-group: palette of pooled characteristics + group drop zones.
     Grid so every role's chips start at the same left edge and wrapped chips
     line up under the first one (not back at the label). */
  .pal-row { display: grid; grid-template-columns: 74px 1fr; align-items: start;
    gap: 10px; margin-bottom: 9px; }
  .pal-role { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
    line-height: 1.3; padding-top: 5px; }
  .pal-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .drag-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
    border-radius: 3px; font-size: 12.5px; border: 1px solid; cursor: grab; user-select: none; }
  .drag-chip[draggable="true"]:active { cursor: grabbing; }
  .drag-chip .chip-role { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .drag-chip .chip-x { border: none; background: none; color: #888; cursor: pointer; font-size: 14px;
    line-height: 1; padding: 0 0 0 2px; }
  .drag-chip .chip-x:hover { color: #dc2626; }
  /* Already dragged into at least one claim. Deliberately still draggable and
     still legible — a characteristic is expected to appear in several claims —
     so "used" reads as a receipt, not as disabled. */
  .drag-chip.used { color: #6b7280; border-style: dashed; }
  .drag-chip.used:hover { color: #111; border-style: solid; }
  /* one badge per claim this characteristic is already in */
  .drag-chip .chip-used { flex: none; min-width: 17px; text-align: center;
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    color: #254c6f; background: #fff; border-radius: 8px; padding: 1px 5px; }
  .drag-chip .chip-used + .chip-used { margin-left: -2px; }
  .drag-chip .chip-more { color: #8a9bb0; }
  .grp-hint { font-size: 12px; color: #b8b8b8; font-style: italic; margin: 4px 0 8px; }
  .grp-box { border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 10px; background: #fcfcfc; }
  .grp-top { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid #eee; }
  .grp-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: #555; }
  .grp-del { margin-left: auto; border: none; background: none; color: #ccc; cursor: pointer;
    font-size: 16px; line-height: 1; }
  .grp-del:hover { color: #dc2626; }
  .grp-add { font-size: 12px; border: 1px dashed #cfcfcf; background: #fff; color: #555;
    border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .grp-add:hover { border-color: #254c6f; color: #254c6f; }
  .grp-section { margin-top: 26px; }
  /* The sentence is the drop zone; dropping a characteristic fills its gap. */
  .grp-sentence { padding: 12px; font-size: 14px; line-height: 2.4; color: #333;
    font-family: Georgia, 'Times New Roman', serif; border-radius: 0 0 4px 4px;
    transition: background .15s ease; }
  .grp-sentence.over { background: #eaf0f6; box-shadow: inset 0 0 0 2px #254c6f; }
  .grp-sentence .sent-v { display: inline-flex; align-items: center; gap: 3px; margin: 0 3px;
    padding: 2px 5px 2px 8px; border-radius: 3px; border: 1px solid #e0e0e0;
    font-family: 'Helvetica Neue', Helvetica, sans-serif; font-size: 12.5px; line-height: 1.3;
    vertical-align: middle; }
  .grp-sentence .sent-x { border: none; background: none; color: #999; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0; }
  .grp-sentence .sent-x:hover { color: #dc2626; }
  .grp-sentence .sent-ph { color: #bbb; font-style: italic; }
  /* an optional clause (using … / developed by …) with nothing dropped in yet */
  .grp-sentence .sent-slot.opt .sent-ph { color: #d4d4d4; }

  .tow-doc { display: flex; gap: 8px; align-items: baseline; font-size: 13px; margin-bottom: 7px;
    cursor: pointer; }
  .tow-doc .dtitle { color: #254c6f; text-decoration: none; flex: 1 1 auto; }
  .tow-doc:hover .dtitle { text-decoration: underline; }
  /* coverage badge: which coders have touched this document (not what they coded) */
  .tow-doc .dcoders { display: flex; gap: 4px; flex: none; }
  .tow-doc .dcoder { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em;
    color: #6b7280; background: #eeeeec; border-radius: 3px; padding: 1px 5px; }
  .tow-doc .dcoder.me { background: #254c6f; color: #fff; }
  .tow-doc .dcoder.none { background: none; color: #bbb; padding-left: 0; }
  .tow-doc .durl { color: #999; font-size: 11px; text-decoration: none; flex: none; }
  .tow-doc .durl:hover { color: #254c6f; text-decoration: underline; }

  .app { position: relative; padding-top: var(--bar-h); }
  .reader { margin-right: 440px; padding: 40px 48px 160px; }
  .side { position: fixed; top: var(--bar-h); right: 0; bottom: 0; width: 440px;
    background: #fff; border-left: 1px solid var(--line); overflow-y: auto;
    padding: 8px 22px 48px; }

  /* Article prose */
  #text { font-family: Georgia, 'Times New Roman', serif; font-size: 19px;
    line-height: 1.85; max-width: 40em; }
  #text h1, #text h2, #text h3 { line-height: 1.25; margin: 1.4em 0 .5em; font-weight: 700; }
  #text h1 { font-size: 1.5em; } #text h2 { font-size: 1.28em; } #text h3 { font-size: 1.1em; }
  #text p { margin: 0 0 1.1em; }
  #text ul, #text ol { margin: 0 0 1.1em; padding-left: 1.4em; }
  #text a { color: #1a1a1a; text-decoration: underline; text-decoration-color: #bbb; }
  #text img { max-width: 100%; height: auto; border-radius: 6px; }
  .doctitle { font-family: Georgia, serif; font-size: 30px; font-weight: 700;
    line-height: 1.2; margin: 0 0 8px; max-width: 40em; }
  .docurl { display: block; margin: 0 0 28px; font-size: 13px; color: var(--accent);
    text-decoration: none; word-break: break-all; max-width: 40em; }
  .docurl:hover { text-decoration: underline; }
  mark { background: transparent; padding: 1px 0 0; cursor: pointer; }
  mark.active { box-shadow: 0 0 0 2px rgba(0,0,0,.4); }

  /* Coding form — clean, monospace, hairline dividers (no boxes) */
  #form { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace; }
  .card { border-top: 1px solid var(--line); padding: 20px 2px; }
  .card:first-child { border-top: none; padding-top: 8px; }
  .card.armed { background: #fbfbfa; }
  .card .head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .card .sq { width: 13px; height: 13px; border-radius: 3px; flex: none; }
  .card .label { font-weight: 700; font-size: 13px; }
  .card .arm { margin-left: auto; font-size: 11px; color: #888; border: 1px solid #dadada;
    border-radius: 5px; padding: 3px 9px; white-space: nowrap; letter-spacing: .01em; }
  .card.armed .arm { color: #111; border-color: #111; }
  .card .body { margin-top: 13px; padding-left: 23px; }
  .card textarea, .card input[type=text] { width: 100%; border: 1px solid #dcdcdc;
    border-radius: 5px; padding: 7px 8px; font: inherit; font-size: 12.5px; color: #333;
    resize: vertical; background: #fff; }
  .card textarea:focus, .card input:focus { outline: none; border-color: #999; }
  /* multi-select dropdown */
  .select { position: relative; }
  .select-control { display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    min-height: 34px; border: 1px solid #dcdcdc; border-radius: 5px; padding: 5px 26px 5px 8px;
    cursor: pointer; background: #fff; }
  .select-control:hover { border-color: #999; }
  .select.open .select-control { border-color: #111; }
  .select-ph { color: #aaa; font-size: 12px; }
  .select-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
    background: #f0f0ef; border: 1px solid #ddd; border-radius: 4px; padding: 2px 4px 2px 7px; }
  .select-tag button { border: none; background: none; color: #999; cursor: pointer;
    font-size: 12px; line-height: 1; padding: 0; }
  .select-tag button:hover { color: #dc2626; }
  /* committed free-text answer: plain, settled text (press Enter to set) */
  .text-answer { display: flex; align-items: flex-start; gap: 8px; padding: 4px 2px;
    font-size: 12.5px; color: #111; line-height: 1.5; cursor: pointer; }
  .text-answer:hover { color: #000; }
  .text-answer .val { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .text-answer .x { border: none; background: none; color: #ccc; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0; flex: none; }
  .text-answer .x:hover { color: #dc2626; }
  /* incident id: input + existing-incident picker */
  .incident-id { display: flex; flex-direction: column; gap: 6px; padding: 2px; }
  .inc-input { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid #ddd;
    border-radius: 6px; width: 100%; box-sizing: border-box; }
  .inc-input:focus { outline: none; border-color: #111; }
  .inc-row { display: flex; gap: 6px; }
  .inc-select { flex: 1; font: inherit; font-size: 12px; padding: 5px 6px; border: 1px solid #ddd;
    border-radius: 6px; background: #fff; cursor: pointer; }
  .inc-new { font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid #ddd;
    border-radius: 6px; background: #fafafa; cursor: pointer; white-space: nowrap; }
  .inc-new:hover { border-color: #111; background: #fff; }
  .caret { position: absolute; right: 9px; top: 9px; color: #999; font-size: 10px;
    pointer-events: none; }
  .select-menu { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
    background: #fff; border: 1px solid #ccc; border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12); max-height: 260px; overflow-y: auto;
    padding: 5px; display: none; }
  .select.open .select-menu { display: block; }
  .menu-opt { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #333;
    padding: 6px 8px; border-radius: 5px; cursor: pointer; }
  .menu-opt:hover { background: #f5f5f4; }
  .menu-opt input { margin: 0; accent-color: #111; }
  .menu-opt.sel { color: #111; font-weight: 600; }
  /* Collapsible group heading inside a dropdown (harm / factor categories).
     Collapsed by default, and sticky while open so you always know which group
     you're scrolling through. */
  .menu-group { display: flex; align-items: center; gap: 6px; width: 100%;
    position: sticky; top: -5px; z-index: 1; background: #fff; text-align: left;
    font: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    font-weight: 700; color: #6b7280; border: none; border-radius: 5px;
    padding: 8px; margin: 2px 0; cursor: pointer; }
  .menu-group:hover { background: #f5f5f4; color: #111; }
  .menu-group.open { color: #111; }
  .menu-group .mg-caret { font-size: 8px; color: #9ca3af; width: 8px; flex: none; }
  .menu-group.open .mg-caret { color: #111; }
  .menu-group .mg-name { flex: 1; white-space: normal; line-height: 1.35; }
  /* how many of this group's options are already chosen — a collapsed group must
     not hide that its contents are in use */
  .menu-group .mg-sel { flex: none; background: #111; color: #fff; border-radius: 9px;
    padding: 1px 6px; font-size: 9px; letter-spacing: 0; }
  .menu-group .mg-n { flex: none; color: #c4c4c4; font-weight: 600; letter-spacing: 0; }
  .menu-opt.in-group { margin-left: 14px; }
  .cat-vopt.in-group { margin-left: 14px; width: calc(100% - 14px); }
  .menu-add { display: flex; gap: 6px; padding: 7px 6px 4px; border-top: 1px solid #eee;
    margin-top: 4px; }
  .menu-add input { flex: 1; font-size: 12px; padding: 5px 8px; }
  .menu-add button { font-size: 12px; border: 1px solid #dcdcdc; background: #fff;
    border-radius: 5px; padding: 5px 10px; cursor: pointer; color: #333; }
  .menu-add button:hover { border-color: #111; }
  .sub { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: #b0b0b0; margin: 17px 0 7px; }
  .quotes { display: flex; flex-direction: column; gap: 6px; }
  .quote { font-size: 12px; line-height: 1.5; color: #555; background: none;
    border-left: 2px solid #ccc; padding: 1px 20px 1px 12px;
    position: relative; cursor: pointer; }
  .quote .x { position: absolute; top: 1px; right: 4px; border: none; background: none;
    color: #ccc; cursor: pointer; font-size: 13px; line-height: 1; }
  .quote .x:hover { color: #dc2626; }
  .quotes-empty { font-size: 11.5px; color: #bbb; }
  .comments { margin-top: 0; }

  /* Role highlights carry a subscript claim number; hovering links a claim's marks */
  mark.role-mark[data-badge]::after { content: attr(data-badge); display: inline-block;
    box-sizing: border-box; width: 1.4em; height: 1.4em; line-height: 1.4em; text-align: center;
    font-size: .66em; font-weight: 800; border-radius: 50%; background: #111; color: #fff;
    vertical-align: super; margin-left: 3px; }
  mark.linked { box-shadow: 0 0 0 2px rgba(0,0,0,.55); }
  #arrows { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 6; }
  .arrow-path { fill: none; stroke: #111; stroke-width: 1.6; opacity: .7; }

  /* highlight-first category pop-up */
  .cat-menu { position: fixed; z-index: 40; background: #fff; border: 1px solid #ccc;
    border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.16); padding: 9px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 300px; }
  .cat-title { font-size: 11px; color: #666; margin-bottom: 8px; max-width: 280px; }
  .cat-group { margin-bottom: 6px; }
  .cat-group-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em;
    color: #aaa; margin-bottom: 5px; }
  .cat-btns { display: flex; flex-wrap: wrap; gap: 5px; }
  .cat-btn { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 11.5px;
    border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; color: #222; }
  .cat-btn:hover { border-color: #111; }
  .cat-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .cat-btn-wrap { display: inline-flex; align-items: stretch; }
  .cat-btn-wrap .cat-btn { border-radius: 6px 0 0 6px; border-right: none; }
  /* Chips with no value-picker caret (e.g. aftermath) keep a full, closed button. */
  .cat-btn-wrap .cat-btn:only-child { border-radius: 6px; border-right: 1px solid #ddd; }
  .cat-caret { font: inherit; font-size: 9px; border: 1px solid #ddd; background: #fafafa;
    border-radius: 0 6px 6px 0; padding: 0 6px; cursor: pointer; color: #888; }
  .cat-caret:hover { border-color: #111; color: #111; background: #fff; }
  .cat-vlist { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .cat-vopt { display: block; width: 100%; text-align: left; font: inherit; font-size: 12px;
    border: 1px solid #eee; background: #fff; border-radius: 6px; padding: 5px 9px; cursor: pointer; color: #222; }
  .cat-vopt:hover { border-color: #111; }
  .cat-vopt-text { color: #2563eb; border-color: #cfe0ff; margin-bottom: 3px; }
  .cat-vopt-text:hover { border-color: #2563eb; }
  .cat-back { font-size: 11px; border: none; background: none; color: #888; cursor: pointer;
    padding: 5px 2px 2px; }
  .cat-back:hover { color: #111; }
  .cat-newclaim { font-size: 11px; border: 1px dashed #cfcfcf; background: #fff; border-radius: 6px;
    padding: 5px 9px; cursor: pointer; color: #555; margin: 2px 0 6px; width: 100%; }
  .cat-newclaim:hover { border-color: #111; color: #111; }
  .cat-div { border-top: 1px solid #eee; margin: 4px 0 8px; }
  .cat-del { display: block; width: 100%; text-align: left; font: inherit; font-size: 12px;
    border: 1px solid #f0c4c4; background: #fff; color: #b91c1c; border-radius: 6px;
    padding: 6px 9px; cursor: pointer; margin-bottom: 5px; }
  .cat-del:hover { background: #fef2f2; border-color: #b91c1c; }
  .cat-goto { display: block; width: 100%; text-align: left; font: inherit; font-size: 12px;
    border: 1px solid #ddd; background: #fff; color: #333; border-radius: 6px;
    padding: 6px 9px; cursor: pointer; }
  .cat-goto:hover { border-color: #111; }
  /* multi-select chip state */
  .cat-btn.on { border-color: #111; background: #111; color: #fff; }
  .cat-btn .cat-check { display: inline-block; width: 9px; font-size: 10px; line-height: 1; }
  .cat-done { display: block; width: 100%; text-align: center; font: inherit; font-size: 12px;
    font-weight: 600; border: 1px solid #111; background: #111; color: #fff; border-radius: 6px;
    padding: 6px 9px; cursor: pointer; margin-top: 8px; }
  .cat-done:hover { background: #333; }
  /* span menu: one row per category on a shared highlight */
  .span-row { display: flex; align-items: center; gap: 7px; padding: 4px 2px; }
  .span-name { flex: 1; font-size: 12px; color: #333; }
  .span-x { border: none; background: none; color: #b91c1c; cursor: pointer; font-size: 12px;
    padding: 0 4px; line-height: 1; }
  .span-x:hover { color: #7f1d1d; }

  /* Claims panel — actor ↔ harm ↔ factor ↔ harmed party */
  .claims-section { border-top: 2px solid var(--line); margin-top: 26px; padding: 20px 2px 8px; }
  .claims-head { display: flex; align-items: baseline; gap: 8px; }
  .claims-head .label { font-weight: 700; font-size: 13px; }
  .claims-empty { font-size: 11.5px; color: #bbb; margin: 10px 0; }
  .claim-list { display: flex; flex-direction: column; gap: 14px; }
  .claim-row { border: 1px solid #e2e2e2; border-radius: 8px; padding: 11px 12px; background: #fcfcfc; }
  .claim-top { display: flex; align-items: center; margin-bottom: 10px; }
  .claim-num { font-size: 13px; font-weight: 800; color: #111; letter-spacing: .02em; }
  .claim-del { margin-left: auto; border: none; background: none; color: #ccc; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0; }
  .claim-del:hover { color: #dc2626; }
  .claim-chain { display: flex; flex-direction: column; gap: 4px; }
  .role-slot { border-radius: 6px; padding: 6px 7px; }
  .role-slot.armed { background: #fbfbfa; box-shadow: inset 0 0 0 1px #111; }
  .role-slot .role-head { display: flex; align-items: center; gap: 7px; }
  .role-dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .role-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: #555; min-width: 84px; }
  .role-arm { margin-left: auto; font-size: 10px; color: #888; border: 1px solid #dadada;
    border-radius: 5px; padding: 2px 8px; white-space: nowrap; cursor: pointer; }
  .role-slot.armed .role-arm { color: #111; border-color: #111; }
  .role-select { margin-top: 6px; }

  /* per-selection justification — clean list, no boxes */
  .value-ev { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .ev-none { font-size: 11px; color: #bbb; }
  .ev-row { padding: 0; }
  .ev-head { display: flex; align-items: center; gap: 8px; }
  .ev-dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .ev-val { font-size: 13px; color: #111; font-weight: 600; }
  .ev-count { font-size: 10.5px; color: #bbb; white-space: nowrap; }
  .ev-warn { font-size: 10.5px; color: #d97706; font-weight: 700; white-space: nowrap; }
  .ev-arm { margin-left: auto; font-size: 10px; color: #9a9a9a; border: none; background: none;
    cursor: pointer; padding: 2px 4px; }
  .ev-arm:hover { color: #111; }
  .ev-row.armed .ev-arm { color: #111; font-weight: 700; }
  .ev-row .quotes { margin: 5px 0 0 2px; }
  .claim-arrow { color: #cbd5e1; font-size: 12px; text-align: center; line-height: 1; margin: 1px 0; }
  .claim-add { margin-top: 14px; font-size: 12px; border: 1px dashed #cfcfcf; background: #fff;
    border-radius: 6px; padding: 8px 12px; cursor: pointer; color: #555; width: 100%; }
  .claim-add:hover { border-color: #111; color: #111; }
</style>
</head>
<body>
<div class="bar">
  <div class="viewtabs">
    <button id="tabIncidents" class="tab active">Incidents</button>
    <button id="tabDocs" class="tab">Documents</button>
  </div>
  <label class="coderpick" title="Whose coding you are viewing and editing. Each coder's work is saved separately.">
    Coding as <select id="coderSelect"></select>
  </label>
  <select id="docSelect"></select>
  <button id="pushBtn" class="pull" title="Push all local coding + claim groups up to MongoDB">Push to Mongo</button>
  <button id="pullBtn" class="pull" title="Overwrite local annotations with the copy in MongoDB (Mongo wins)">Pull from Mongo</button>
  <span class="hint" id="armHint"></span>
  <span class="status" id="status"></span>
</div>

<!-- By-incident view: one card per incident, populated from /api/incidents -->
<div id="incidents"></div>

<div class="app">
  <div class="reader">
    <div class="doctitle" id="docTitle">Loading…</div>
    <a class="docurl" id="docUrl" target="_blank" rel="noopener"></a>
    <div id="text"></div>
  </div>
  <div class="side"><div id="form"></div></div>
</div>

<!-- overlay for arrows connecting a claim's highlighted characteristics -->
<svg id="arrows" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"></path>
    </marker>
  </defs>
  <g id="arrowLines"></g>
</svg>

<script>
// ---------- who is coding ----------
// Several coders code the same documents and incidents independently, so every
// API call has to say who it is for. Rather than thread a coder argument through
// the ~12 call sites below, wrap fetch once: same-origin /api/ requests get the
// active coder appended. Chosen in the toolbar and remembered in localStorage.
let CODER = localStorage.getItem('coder') || '';
const _fetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  if (CODER && typeof input === 'string' && input.startsWith('/api/')) {
    input += (input.includes('?') ? '&' : '?') + 'coder=' + encodeURIComponent(CODER);
  }
  return _fetch(input, init);
};

// Fill the toolbar picker from the server's coder list. Switching coder reloads
// the page so nothing from the previous coder's session lingers on screen.
async function initCoders() {
  const sel = document.getElementById('coderSelect');
  let d;
  try { d = await _fetch('/api/coders').then(r => r.json()); }
  catch (e) { sel.style.display = 'none'; return; }
  const coders = d.coders || [];
  if (!coders.includes(CODER)) { CODER = d.current || coders[0] || ''; }
  localStorage.setItem('coder', CODER);
  sel.innerHTML = coders.map(c =>
    `<option value="${c}"${c === CODER ? ' selected' : ''}>${c}</option>`).join('');
  sel.onchange = () => {
    localStorage.setItem('coder', sel.value);
    location.reload();
  };
}

const COLORS = ['#fde68a','#a5d6b0','#bfdbfe','#f3b7ac','#ddd6fe','#f9c9e0','#a7f3d0',
                '#fed7aa','#c7d2fe','#fecdd3','#bbf7d0','#e9d5ff'];
let SCHEMA = [];           // [{key,label,type,options}]
const color = {};          // field key -> highlight color
let curDoc = null;         // {index,title,url,markdown,ann:{fields,quotes,claims},_plain}
let saveTimer = null;

// A claim links four roles; each highlight is colored by ROLE and carries the
// claim's number so evidence for the same claim reads as connected.
// Four maximally-distinct hues so role highlights never read as the same color.
// Order here is the order they appear in the document sidebar and the incident
// palette: factor before harm, matching the highlight tag menu (TAG_ORDER).
const ROLES = [
  { role: 'actor',        label: 'Actor',        color: '#fde047' },  // yellow
  { role: 'factor',       label: 'Factor',       color: '#86efac' },  // green
  { role: 'harm',         label: 'Harm',         color: '#fca5a5' },  // red
  { role: 'harmed_party', label: 'Harmed party', color: '#7dd3fc' },  // blue
];
const ROLE = Object.fromEntries(ROLES.map(r => [r.role, r]));

// Incident-level fields that are also draggable into a claim, filling its
// optional "using … developed by …" clauses. They are not characteristics — they
// aren't coded per document as roles — so they live outside ROLES and only exist
// in the incident card view. `field` is where their values come from.
const CLAIM_FIELDS = [
  { role: 'system',    field: 'incident_system',    label: 'System',    color: '#c4b5fd' },  // violet
  { role: 'developer', field: 'incident_developer', label: 'Developer', color: '#fdba74' },  // orange
];
// Lookup for anything droppable into a claim: the four roles plus these two.
const CLAIM_ROLE = { ...ROLE, ...Object.fromEntries(CLAIM_FIELDS.map(c => [c.role, c])) };
let SCHEMA_ROLES = [];      // [{role,label,options,groups?}] from schema.claim_roles
function roleOptions(role) {
  const r = SCHEMA_ROLES.find(x => x.role === role);
  return (r && r.options) || [];
}
function setRoleOptions(role, opts) {
  const r = SCHEMA_ROLES.find(x => x.role === role);
  if (r) r.options = opts;
}
// Optional presentation grouping from vocab.json ("<list>_groups"), e.g. harm and
// factor. [{label, options}] or undefined.
function roleGroups(role) {
  const r = SCHEMA_ROLES.find(x => x.role === role);
  return (r && r.groups) || null;
}

// Arrange a flat option list into labelled sections for a menu. Sections follow
// the vocab's group order; anything ungrouped (including options a coder added
// themselves) falls into a trailing "Other" so nothing can be hidden by a group
// that forgot it. With no groups defined it's one unlabelled section, i.e. the
// plain flat list this app had before.
function groupedOptions(options, groups) {
  if (!groups || !groups.length) return [{ label: '', options }];
  const placed = new Set(), out = [];
  groups.forEach(g => {
    const opts = (g.options || []).filter(o => options.includes(o));
    opts.forEach(o => placed.add(o));
    if (opts.length) out.push({ label: g.label, options: opts });
  });
  const rest = options.filter(o => !placed.has(o));
  if (rest.length) out.push({ label: 'Other', options: rest });
  return out;
}

// A collapsible group heading, shared by the multiselect and the highlight value
// picker. `expanded` is the caller's Set of open labels; clicking toggles this
// group and asks the caller to rebuild. `nSel` (optional) is how many of the
// group's options are already chosen — shown as a badge, since a collapsed group
// would otherwise hide that its contents are in use.
function groupHeader(section, expanded, rebuild, nSel) {
  const open = expanded.has(section.label);
  const head = document.createElement('button');
  head.type = 'button';
  head.className = 'menu-group' + (open ? ' open' : '');
  head.dataset.group = section.label;
  head.innerHTML =
    `<span class="mg-caret">${open ? '▾' : '▸'}</span>` +
    `<span class="mg-name">${escapeHtml(section.label)}</span>` +
    (nSel ? `<span class="mg-sel">${nSel}</span>` : '') +
    `<span class="mg-n">${section.options.length}</span>`;
  head.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();   // don't close the menu we're in
    if (open) expanded.delete(section.label); else expanded.add(section.label);
    rebuild();
  };
  return head;
}

// What's currently receiving highlights: a specific selected value in a field or
// claim-role multiselect (value is undefined for a whole text field).
// null | {type:'field', key, value} | {type:'role', claim, role, value}
let armed = null;
// A just-completed text selection must not also trigger a highlighted mark's
// span menu (which would replace the tag menu). Set on selection, cleared next tick.
let skipSpanClick = false;
function sameArm(t) {
  if (!armed || armed.type !== t.type) return false;
  if (t.type === 'field') return armed.key === t.key && armed.value === t.value;
  return armed.role === t.role && armed.value === t.value;
}
function setArm(t) { armed = sameArm(t) ? null : t; afterArm(); }

async function init() {
  await initCoders();   // before any /api/ call, so each one is attributed
  const schema = await (await fetch('/api/schema')).json();
  SCHEMA = schema.fields;
  SCHEMA_ROLES = schema.claim_roles || [];
  SCHEMA.forEach((f, i) => color[f.key] = COLORS[i % COLORS.length]);
  const docs = await (await fetch('/api/docs')).json();
  const sel = document.getElementById('docSelect');
  sel.innerHTML = docs.map(d =>
    `<option value="${d.index}">${d.title.slice(0,80)}${d.n ? '  ('+d.n+')' : ''}</option>`).join('');
  sel.onchange = () => loadDoc(+sel.value);
  document.getElementById('pullBtn').onclick = pullFromMongo;
  document.getElementById('pushBtn').onclick = pushToMongo;
  document.getElementById('tabDocs').onclick = () => setView('docs');
  document.getElementById('tabIncidents').onclick = () => setView('incidents');
  loadDoc(docs.length ? docs[0].index : 0);
  setView('incidents');   // land on the Incidents view first
}

// ---------- by-incident view ----------
// Toggle between the per-document coder ('docs') and the incident overview
// ('incidents'). CSS keyed off body.view-incidents shows/hides each surface.
function setView(v) {
  document.body.classList.toggle('view-incidents', v === 'incidents');
  document.getElementById('tabDocs').classList.toggle('active', v === 'docs');
  document.getElementById('tabIncidents').classList.toggle('active', v === 'incidents');
  if (v === 'incidents') loadIncidents();
}

async function loadIncidents() {
  const wrap = document.getElementById('incidents');
  wrap.innerHTML = '<div class="inc-wrap"><div class="iempty">Loading…</div></div>';
  let data;
  try { data = await (await fetch('/api/incidents')).json(); }
  catch (e) {
    wrap.innerHTML = '<div class="inc-wrap"><div class="iempty">Failed to load incidents.</div></div>'; return;
  }
  INCIDENTS = {};
  data.incidents.forEach(inc => { INCIDENTS[inc.incident_id] = inc; });
  const body = data.incidents.length
    ? data.incidents.map(inc => incidentCard(inc, data.fields)).join('')
    : '<div class="iempty">No incidents coded yet.</div>';
  wrap.innerHTML = `<div class="inc-wrap">${body}</div>`;
  // Clicking a source document opens it in the coder (Documents view).
  wrap.querySelectorAll('.tow-doc').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('.durl')) return;   // let the external link work
      const i = +el.dataset.index;
      setView('docs');
      document.getElementById('docSelect').value = i;
      loadDoc(i);
    };
  });
  // Wire the palette + draggable System/Developer chips (left) and the
  // drag-to-group claims (right) to their incident.
  wrap.querySelectorAll('.tow-palette').forEach(el => buildPalette(el, INCIDENTS[el.dataset.inc]));
  wrap.querySelectorAll('.tow-dragfield').forEach(el => buildFieldChips(el, INCIDENTS[el.dataset.inc]));
  wrap.querySelectorAll('.tow-groups').forEach(el => buildGroupsUI(el, INCIDENTS[el.dataset.inc]));
}

const NODATA = '<span class="tow-nodata">No data</span>';
let INCIDENTS = {};   // incident_id -> incident object, for post-render handlers

// A Tow/CJR-styled card carrying every detail the JSON holds for one incident.
// Anything un-coded renders as "No data". The characteristics palette + claim
// groups are an interactive placeholder filled in by buildGroupsUI after render.
function incidentCard(inc, fields) {
  const chips = arr => arr.map(v => `<span class="tow-chip">${escapeHtml(v)}</span>`).join('');

  // One field block (System, Developer, Aftermath, …) — value chips or "No data",
  // plus any coder comments left on the field.
  // System and Developer feed the claim sentence's optional clauses, so their
  // chips are draggable. They're filled in after render (by buildFieldChips) so
  // they can carry the same claim badges as the palette, rather than being
  // duplicated in two places on the card.
  const fieldBlock = (f) => {
    const vals = inc.field_values[f.key] || [];
    const cmts = (inc.field_comments && inc.field_comments[f.key]) || [];
    const dragField = CLAIM_FIELDS.some(c => c.field === f.key);
    const valHtml = !vals.length ? NODATA
      : (dragField
          ? `<span class="tow-dragfield" data-field="${f.key}" data-inc="${escapeHtml(inc.incident_id)}"></span>`
          : chips(vals));
    const cmtHtml = cmts.map(c => `<div class="tow-comment">“${escapeHtml(c)}”</div>`).join('');
    return `<div class="tow-field"><div class="tow-label">${escapeHtml(f.label)}</div>`
      + `<div class="tow-value">${valHtml}${cmtHtml}</div></div>`;
  };
  // Aftermath renders last of all, under the claim groups; the rest sit up left.
  const leftFieldBlocks = fields.filter(f => f.key !== 'incident_aftermath').map(fieldBlock).join('');
  const aftermath = fields.find(f => f.key === 'incident_aftermath');
  const aftermathBlock = aftermath ? fieldBlock(aftermath) : '';

  const docsHtml = inc.documents.map(d => {
    const url = d.url
      ? `<a class="durl" href="${escapeHtml(d.url)}" target="_blank" rel="noopener">source ↗</a>` : '';
    // Who has coded this document — progress only, never their codes, so coders
    // stay blind to each other's judgements while coding.
    const by = (d.coded_by || []);
    const badge = by.length
      ? `<span class="dcoders" title="Coded by ${escapeHtml(by.join(', '))}">${
          by.map(c => `<span class="dcoder${c === CODER ? ' me' : ''}">${escapeHtml(c)}</span>`).join('')}</span>`
      : '<span class="dcoders"><span class="dcoder none">uncoded</span></span>';
    return `<div class="tow-doc" data-index="${d.index}">`
      + `<span class="dtitle">${escapeHtml(d.title || '(untitled document)')}</span>${badge}${url}</div>`;
  }).join('');

  const encId = escapeHtml(inc.incident_id);
  return `<div class="tow-card">
    <div class="tow-head">
      <span class="tow-id">${encId}</span>
      <div class="tow-headdocs">${docsHtml}</div>
    </div>
    <div class="tow-body">
      <div class="tow-col c1">
        ${leftFieldBlocks}
        <div class="tow-palette" data-inc="${encId}"></div>
      </div>
      <div class="tow-col c2">
        <div class="tow-groups" data-inc="${encId}"></div>
        ${aftermathBlock}
      </div>
    </div>
  </div>`;
}

const roleColor = (role) => (CLAIM_ROLE[role] && CLAIM_ROLE[role].color) || '#e5e7eb';
const roleLabel = (role) => (CLAIM_ROLE[role] && CLAIM_ROLE[role].label) || role;

// Persist an incident's groups (debounced-ish: fire immediately, it's small).
async function saveGroups(inc) {
  try {
    await fetch('/api/incident/' + encodeURIComponent(inc.incident_id) + '/groups', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ groups: inc.groups }),
    });
  } catch (e) { /* non-fatal: local drag state stays until reload */ }
}

// Which claims a characteristic has been dragged into. A value can belong to any
// number of claims — dragging copies rather than moves — so this returns every
// claim id that holds it, and the palette shows them on the chip.
function usedInClaims(inc, role, value) {
  return (inc.groups || [])
    .filter(g => (g.members || []).some(m => m.role === role && m.value === value))
    .map(g => g.id);
}

// Re-render everything draggable on an incident's card — the characteristics
// palette and the System/Developer field chips — so their claim marks match the
// current claims. Called after every claim change; these live in a sibling
// column, so they're found by incident id rather than passed around.
function refreshDraggables(inc) {
  document.querySelectorAll('.tow-palette').forEach(el => {
    if (el.dataset.inc === inc.incident_id) buildPalette(el, inc);
  });
  document.querySelectorAll('.tow-dragfield').forEach(el => {
    if (el.dataset.inc === inc.incident_id) buildFieldChips(el, inc);
  });
}

// The pooled characteristics palette (left column) — draggable chips grouped by
// role, each marked with the claims it's already used in.
function buildPalette(container, inc) {
  if (!inc) return;
  container.innerHTML = '';
  const palette = document.createElement('div');
  palette.className = 'tow-field';
  palette.innerHTML = `<div class="tow-label">Characteristics</div>`;
  // Characteristics only. System and Developer are draggable too, but from their
  // own field blocks higher up the card — see buildFieldChips.
  const anyValues = ROLES.some(r => (inc.role_values[r.role] || []).length);
  if (!anyValues) {
    const nd = document.createElement('div'); nd.innerHTML = NODATA;
    palette.appendChild(nd);
  } else {
    ROLES.forEach(r => {
      const vals = inc.role_values[r.role] || [];
      if (!vals.length) return;
      const row = document.createElement('div'); row.className = 'pal-row';
      const lbl = document.createElement('span');
      lbl.className = 'pal-role'; lbl.style.color = roleColor(r.role); lbl.textContent = r.label;
      const chips = document.createElement('div'); chips.className = 'pal-chips';
      vals.forEach(v => chips.appendChild(makeChip(r.role, v, usedInClaims(inc, r.role, v))));
      row.appendChild(lbl); row.appendChild(chips);
      palette.appendChild(row);
    });
  }
  container.appendChild(palette);
}

// Fill a System / Developer field block with draggable chips. Same chip as the
// palette's, so it drags into a claim and shows which claims already use it.
function buildFieldChips(container, inc) {
  if (!inc) return;
  const cfg = CLAIM_FIELDS.find(c => c.field === container.dataset.field);
  if (!cfg) return;
  container.innerHTML = '';
  ((inc.field_values || {})[cfg.field] || []).forEach(v => {
    container.appendChild(makeChip(cfg.role, v, usedInClaims(inc, cfg.role, v)));
  });
}

// The claim groups (right column) — each a fill-in-the-blank sentence + drop zone.
// Rebuilds itself on every change and persists per incident.
function buildGroupsUI(container, inc) {
  if (!inc) return;
  // Always start with one claim ready (auto-selected). Empty groups aren't saved
  // server-side, so this just seeds the first sentence template each load.
  if (!inc.groups.length) inc.groups.push({ id: '1', members: [] });
  container.innerHTML = '';

  const groupsWrap = document.createElement('div');
  groupsWrap.className = 'tow-field';
  groupsWrap.innerHTML = `<div class="tow-label">Groups (linked claims)</div>`;
  inc.groups.forEach(grp => groupsWrap.appendChild(buildGroupBox(inc, grp, container)));

  const add = document.createElement('button');
  add.className = 'grp-add'; add.textContent = '+ New group';
  add.onclick = () => {
    const n = inc.groups.reduce((mx, g) => Math.max(mx, parseInt(g.id, 10) || 0), 0) + 1;
    inc.groups.push({ id: String(n), members: [] });
    saveGroups(inc);
    buildGroupsUI(container, inc);
  };
  groupsWrap.appendChild(add);
  container.appendChild(groupsWrap);
  refreshDraggables(inc);   // keep the chips' claim marks in step with the claims
}

// A draggable palette chip (characteristics palette only). `claims` is the list
// of claim ids this value is already in — a used chip stays fully draggable,
// since the same characteristic is expected to appear in several claims; it just
// carries the claim numbers so you can see what's still unplaced.
function makeChip(role, value, claims) {
  claims = claims || [];
  const chip = document.createElement('span');
  chip.className = 'drag-chip' + (claims.length ? ' used' : '');
  chip.style.background = roleColor(role) + (claims.length ? '22' : '44');
  chip.style.borderColor = roleColor(role);
  chip.draggable = true;
  chip.title = claims.length
    ? `${roleLabel(role)} — used in claim ${claims.join(', ')}. Drag again to add it to another claim.`
    : `${roleLabel(role)} — not yet used. Drag into a claim.`;
  chip.appendChild(document.createTextNode(value));
  // One badge per claim, so each claim reads as its own mark rather than as a
  // run-together number. Capped at three so a much-reused value can't stretch
  // the chip; the overflow badge says how many more.
  claims.slice(0, 3).forEach(id => {
    const badge = document.createElement('span');
    badge.className = 'chip-used';
    badge.textContent = id;
    chip.appendChild(badge);
  });
  if (claims.length > 3) {
    const more = document.createElement('span');
    more.className = 'chip-used chip-more';
    more.textContent = '+' + (claims.length - 3);
    chip.appendChild(more);
  }
  chip.ondragstart = (e) => {
    e.dataTransfer.setData('text/plain', JSON.stringify({ role, value }));
    e.dataTransfer.effectAllowed = 'copy';
  };
  return chip;
}

// A group is just the claim sentence; the sentence itself is the drop target and
// dropping a characteristic fills its slot. Filled values are removable chips.
function buildGroupBox(inc, grp, container) {
  const box = document.createElement('div');
  box.className = 'grp-box';

  const top = document.createElement('div');
  top.className = 'grp-top';
  top.innerHTML = `<span class="grp-name">Claim ${escapeHtml(grp.id)}</span>`;
  const del = document.createElement('button');
  del.className = 'grp-del'; del.textContent = '×'; del.title = 'Delete claim';
  del.onclick = () => {
    inc.groups = inc.groups.filter(g => g !== grp);
    saveGroups(inc);
    buildGroupsUI(container, inc);
  };
  top.appendChild(del);
  box.appendChild(top);

  box.appendChild(groupSentence(inc, grp, container));
  return box;
}

// [actors] using [systems] developed by [developers] allegedly caused [harms]
// to [parties] because of [factors].
// The whole sentence is one drop zone; the dragged chip's role decides which
// gap it fills. Empty gaps show a muted placeholder; filled values are chips
// with a × to remove them.
//
// "using …" and "developed by …" are optional: they appear once the incident has
// a system/developer coded (so there's something to drop), and vanish entirely
// when it doesn't — a claim reads as complete without them.
function groupSentence(inc, grp, container) {
  const s = document.createElement('div');
  s.className = 'grp-sentence';

  const slot = (role, placeholder) => {
    const span = document.createElement('span');
    span.className = 'sent-slot';
    const vals = grp.members.filter(m => m.role === role).map(m => m.value);
    if (!vals.length) {
      span.innerHTML = `<span class="sent-ph">[${escapeHtml(placeholder)}]</span>`;
      return span;
    }
    vals.forEach((v, i) => {
      if (i) span.appendChild(document.createTextNode(' & '));
      const chip = document.createElement('span');
      chip.className = 'sent-v';
      chip.style.background = roleColor(role) + '33';
      chip.style.borderColor = roleColor(role);
      chip.appendChild(document.createTextNode(v));
      const x = document.createElement('button');
      x.className = 'sent-x'; x.textContent = '×'; x.title = 'Remove';
      x.onclick = () => {
        grp.members = grp.members.filter(m => !(m.role === role && m.value === v));
        saveGroups(inc);
        buildGroupsUI(container, inc);
      };
      chip.appendChild(x);
      span.appendChild(chip);
    });
    return span;
  };

  const txt = (t) => s.appendChild(document.createTextNode(t));
  // An optional clause: shown when it's filled, or when the incident has values
  // of that kind waiting in the palette. Otherwise the sentence skips it.
  const optional = (cfg, lead, placeholder) => {
    const filled = grp.members.some(m => m.role === cfg.role);
    const available = ((inc.field_values || {})[cfg.field] || []).length;
    if (!filled && !available) return;
    txt(lead);
    const sp = slot(cfg.role, placeholder);
    if (!filled) sp.classList.add('opt');   // muted: nothing dropped here yet
    s.appendChild(sp);
  };

  s.appendChild(slot('actor', 'actor(s)'));
  optional(CLAIM_FIELDS[0], ' using ', 'system(s)');
  optional(CLAIM_FIELDS[1], ' developed by ', 'developer(s)');
  txt(' allegedly caused ');
  s.appendChild(slot('harm', 'harm(s)'));
  txt(' to ');
  s.appendChild(slot('harmed_party', 'party/ies'));
  txt(' because of ');
  s.appendChild(slot('factor', 'factor(s)'));

  s.ondragover = (e) => { e.preventDefault(); s.classList.add('over'); };
  s.ondragleave = () => s.classList.remove('over');
  s.ondrop = (e) => {
    e.preventDefault(); s.classList.remove('over');
    let m; try { m = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (_) { return; }
    if (!m || !m.role || !m.value) return;
    if (!grp.members.some(x => x.role === m.role && x.value === m.value)) {
      grp.members.push({ role: m.role, value: m.value });
      saveGroups(inc);
      buildGroupsUI(container, inc);
    }
  };
  return s;
}

// Push everything local (per-document coding + incident groups + pooled lists)
// up to Mongo. Non-destructive to local data.
async function pushToMongo() {
  const btn = document.getElementById('pushBtn');
  const status = document.getElementById('status');
  if (!confirm(`Push ${CODER}'s coding and claim groups up to MongoDB? Other coders' work is left as it is.`)) return;
  btn.disabled = true;
  status.textContent = 'Pushing to Mongo…';
  try {
    const res = await fetch('/api/push', { method: 'POST' });
    const j = await res.json();
    if (!res.ok || !j.ok) throw new Error(j.error || 'push failed');
    status.textContent = `Pushed ${j.documents} document(s), ${j.incidents} incident(s), ${j.groups} group(s) as ${j.coder} ✓`;
  } catch (e) {
    status.textContent = 'Push failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// Manual bring-back: overwrite local annotations with Mongo's copy (Mongo wins),
// then reload so the fetched coding shows. Guard against a double-click.
async function pullFromMongo() {
  const btn = document.getElementById('pullBtn');
  const status = document.getElementById('status');
  if (!confirm(`Pull ${CODER}'s annotations from MongoDB? Mongo's copy overwrites ${CODER}'s local edits for any document that exists in both; other coders' files are untouched.`)) return;
  btn.disabled = true;
  status.textContent = 'Pulling from Mongo…';
  try {
    const res = await fetch('/api/pull', { method: 'POST' });
    const j = await res.json();
    if (!res.ok || !j.ok) throw new Error(j.error || 'pull failed');
    status.textContent = `Pulled ${j.pulled} document(s) from Mongo as ${j.coder} ✓`;
    location.reload();
  } catch (e) {
    status.textContent = 'Pull failed: ' + e.message;
    btn.disabled = false;
  }
}

// Existing incident IDs (for the "connect to another article" picker) + the next
// suggested new ID. Refreshed from the server whenever a document loads.
let INCIDENT_IDS = [], INCIDENT_NEXT = '', INCIDENT_TITLES = {};
async function refreshIncidentIds() {
  try {
    const d = await (await fetch('/api/incident_ids')).json();
    INCIDENT_IDS = d.ids || []; INCIDENT_NEXT = d.next || ''; INCIDENT_TITLES = d.titles || {};
  } catch (e) { INCIDENT_IDS = []; INCIDENT_NEXT = ''; INCIDENT_TITLES = {}; }
}

// If an incident ID belongs to an existing incident, copy that incident's title
// in. `overwrite` replaces an existing title (used when explicitly connecting);
// otherwise it only fills a blank title. Returns true if it changed the title.
function fillTitleForIncident(id, overwrite) {
  const t = INCIDENT_TITLES[id];
  if (!t) return false;
  const ta = fieldAnn('incident_title');
  if (!overwrite && ta.answer && String(ta.answer).trim()) return false;
  if (ta.answer === t) return false;
  ta.answer = t;
  return true;
}

async function loadDoc(i) {
  const d = await (await fetch('/api/doc/' + i)).json();
  curDoc = { ...d, ann: d.annotation };
  // Characteristics are selected flat now (no claim linking in the doc view);
  // grouping into claims happens in the incident card view.
  if (!curDoc.ann.roles || typeof curDoc.ann.roles !== 'object') curDoc.ann.roles = {};
  ROLES.forEach(r => { if (!Array.isArray(curDoc.ann.roles[r.role])) curDoc.ann.roles[r.role] = []; });
  delete curDoc.ann.claims;
  // Auto-populate a fresh incident ID for a not-yet-coded article (the coder can
  // still pick an existing one to connect it to another article).
  await refreshIncidentIds();
  const idAnn = fieldAnn('incident_id');
  if (!(idAnn.answer && String(idAnn.answer).trim()) && INCIDENT_NEXT) {
    idAnn.answer = INCIDENT_NEXT;
    persist();
  }
  // If this article's incident ID matches an existing incident, adopt its title.
  if (idAnn.answer && fillTitleForIncident(idAnn.answer, false)) persist();
  armed = null;
  document.getElementById('docTitle').textContent = curDoc.title;
  const u = document.getElementById('docUrl');
  const hasUrl = curDoc.url && curDoc.url !== 'nan';
  u.textContent = hasUrl ? curDoc.url : ''; u.href = hasUrl ? curDoc.url : '#';
  u.style.display = hasUrl ? 'block' : 'none';
  updateArmHint();
  renderArticle();
  renderForm();
  window.scrollTo(0, 0);
}

function field(key) { return SCHEMA.find(f => f.key === key); }
function fieldAnn(key) {
  if (!curDoc.ann.fields[key]) curDoc.ann.fields[key] = { answer: null, comments: '' };
  return curDoc.ann.fields[key];
}
function quotesFor(key) { return curDoc.ann.quotes.filter(q => q.category === key); }

// ---------- article + highlights ----------
function getTextNodes() {
  const root = document.getElementById('text');
  const out = []; const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while ((n = w.nextNode())) out.push(n);
  return out;
}

function renderArticle(keepScroll) {
  const y = window.scrollY;
  const el = document.getElementById('text');
  el.innerHTML = window.marked ? marked.parse(curDoc.markdown) : escapeHtml(curDoc.markdown);
  curDoc._plain = el.textContent;
  paintUnderlines();
  if (keepScroll) requestAnimationFrame(() => window.scrollTo(0, y));
}

function quoteColor(q) {
  return q.role ? ((ROLE[q.role] || {}).color || '#eee') : (color[q.category] || '#fde68a');
}
function quoteLabel(q) {
  const base = q.role ? ((ROLE[q.role] || {}).label || q.role)
                      : ((field(q.category) || {}).label || q.category);
  return base + (q.value ? ' · ' + q.value : '');
}

// Draw each quote's underline at its own fixed lane, so every category is one
// continuous parallel line at a stable height (lane 0 just under the text,
// higher lanes stacked below). All marks reserve the same padding so lines from
// different stretches align. `lines` = [{color, lane}]; totalLanes fixed per doc.
const UL_THICK = 2, UL_GAP = 2, UL_STEP = UL_THICK + UL_GAP;
function applyUnderlines(m, lines, totalLanes) {
  m.style.backgroundImage = lines.map(l => `linear-gradient(${l.color}, ${l.color})`).join(', ');
  m.style.backgroundSize = lines.map(() => `100% ${UL_THICK}px`).join(', ');
  m.style.backgroundPosition = lines.map(l => `0 calc(100% - ${(totalLanes - l.lane) * UL_STEP}px)`).join(', ');
  m.style.backgroundRepeat = 'no-repeat';
  m.style.paddingBottom = ((totalLanes + 1) * UL_STEP) + 'px';
}

// Assign a stable lane to each quote (greedy interval colouring): overlapping
// quotes get different lanes; non-overlapping ones reuse the lowest free lane.
function assignLanes(quotes) {
  const laneOf = {}, laneEnds = [];
  quotes.map((q, idx) => ({ q, idx }))
    .sort((a, b) => a.q.start - b.q.start || a.q.end - b.q.end)
    .forEach(({ q, idx }) => {
      let l = 0;
      while (l < laneEnds.length && laneEnds[l] > q.start) l++;
      laneOf[idx] = l;
      laneEnds[l] = q.end;
    });
  return { laneOf, totalLanes: laneEnds.length };
}

// Paint underlines per character-interval: split the text at every quote
// boundary, and under each stretch draw one line for EVERY quote covering it.
// So overlapping/adjacent selections keep their own lines and stack where they
// overlap — no highlight is ever hidden by another.
function paintUnderlines() {
  const quotes = curDoc.ann.quotes;
  if (!quotes.length) return;
  const { laneOf, totalLanes } = assignLanes(quotes);
  const cuts = [...new Set(quotes.flatMap(q => [q.start, q.end]))].sort((a, b) => a - b);
  const intervals = [];
  for (let k = 0; k < cuts.length - 1; k++) {
    const a = cuts[k], b = cuts[k + 1];
    const items = [];
    quotes.forEach((q, idx) => { if (q.start <= a && q.end >= b) items.push({ q, idx }); });
    if (items.length) intervals.push({ a, b, items });
  }
  intervals.forEach((iv, ii) => wrapInterval(iv, ii, laneOf, totalLanes));
}

function wrapInterval(iv, ii, laneOf, totalLanes) {
  const lines = iv.items.map(it => ({ color: quoteColor(it.q), lane: laneOf[it.idx] }));
  const idxs = iv.items.map(it => it.idx);
  const title = iv.items.map(it => quoteLabel(it.q)).join('  |  ');

  const segs = []; let acc = 0;
  for (const node of getTextNodes()) {
    const ns = acc; acc += node.textContent.length;
    if (node.parentElement && node.parentElement.closest('mark')) continue;
    const s = Math.max(iv.a, ns), e = Math.min(iv.b, acc);
    if (s < e) segs.push({ node, s: s - ns, e: e - ns });
  }
  segs.forEach(({ node, s, e }, si) => {
    const r = document.createRange(); r.setStart(node, s); r.setEnd(node, e);
    const m = document.createElement('mark');
    applyUnderlines(m, lines, totalLanes);
    m.dataset.idxs = idxs.join(' ');   // which quotes this stretch belongs to
    m.title = title;
    m.onclick = () => {
      if (skipSpanClick) return;   // a fresh selection just happened — let it tag
      showSpanMenu(iv.a, iv.b, m.getBoundingClientRect());
    };
    try { r.surroundContents(m); } catch (err) {}
  });
}

function textOffset(node, offset) {
  let total = 0;
  const w = document.createTreeWalker(document.getElementById('text'), NodeFilter.SHOW_TEXT);
  let n; while ((n = w.nextNode())) { if (n === node) return total + offset; total += n.textContent.length; }
  return total;
}

// If this selection is the same text as an already-highlighted quote at the same
// place, reuse that quote's exact span so a second category stacks its underline
// (rather than landing on a near-miss span that renders nothing).
function snapSpan(start, end, text) {
  const t = (text || '').trim();
  if (!t) return { start, end, text };
  const hit = curDoc.ann.quotes.find(q =>
    (q.text || '').trim() === t && q.start < end && start < q.end);   // overlap + same text
  return hit ? { start: hit.start, end: hit.end, text: hit.text } : { start, end, text };
}

document.getElementById('text').addEventListener('mouseup', () => {
  const sel = window.getSelection();
  if (!curDoc || sel.isCollapsed || !sel.toString().trim()) return;
  // Block the mark's click (which fires right after) from opening the span menu.
  skipSpanClick = true;
  setTimeout(() => { skipSpanClick = false; }, 0);
  const r = sel.getRangeAt(0);
  const rect = r.getBoundingClientRect();
  let start = textOffset(r.startContainer, r.startOffset);
  let end = textOffset(r.endContainer, r.endOffset);
  if (start > end) [start, end] = [end, start];
  let text = curDoc._plain.slice(start, end);
  ({ start, end, text } = snapSpan(start, end, text));
  sel.removeAllRanges();

  if (armed) {
    // arm-then-highlight: attach this highlight to the armed field/value
    const q = { text, start, end };
    if (armed.type === 'field') { q.category = armed.key; if (armed.value !== undefined) q.value = armed.value; }
    else { q.role = armed.role; q.value = armed.value; }
    curDoc.ann.quotes.push(q);
    persist(); renderArticle(true);
    if (armed.type === 'field') renderCard(armed.key); else renderRoles();
  } else {
    // highlight-first: choose which category this highlight belongs to
    showCategoryMenu({ start, end, text }, rect);
  }
});

// ---------- highlight-first: file a highlight under a category ----------
let catMenuEl = null;
// Groups the coder has opened in the value picker. Module-level, so it survives
// the menu being torn down and rebuilt after each assignment — otherwise every
// value would need its group re-opened. Starts empty: collapsed by default.
const valueGroupsOpen = new Set();
function closeCategoryMenu() {
  if (catMenuEl) {
    if (catMenuEl._onDown) document.removeEventListener('mousedown', catMenuEl._onDown);
    catMenuEl.remove();
    catMenuEl = null;
  }
}

// File the highlight under a category. `value` defaults to the highlighted text,
// but can be an existing option chosen from the value picker.
function assignHighlight(pending, target, value) {
  value = (value !== undefined ? value : pending.text).trim();
  if (!value) return;
  if (target.type === 'role') {
    if (!Array.isArray(curDoc.ann.roles[target.role])) curDoc.ann.roles[target.role] = [];
    if (!curDoc.ann.roles[target.role].includes(value)) curDoc.ann.roles[target.role].push(value);
    curDoc.ann.quotes.push({ role: target.role, value,
      text: pending.text, start: pending.start, end: pending.end });
  } else if ((field(target.key) || {}).type === 'multi') {
    const fa = fieldAnn(target.key);
    if (!Array.isArray(fa.answer)) fa.answer = fa.answer ? [fa.answer] : [];
    if (!fa.answer.includes(value)) fa.answer.push(value);
    curDoc.ann.quotes.push({ category: target.key, value,
      text: pending.text, start: pending.start, end: pending.end });
  } else {
    // Free-text field (e.g. aftermath): the highlight is justification only —
    // no multi-select value, so the field stays free text.
    curDoc.ann.quotes.push({ category: target.key,
      text: pending.text, start: pending.start, end: pending.end });
  }
  persist();
  renderArticle(true);
  renderForm();
}

// Does a quote sit on this span under this exact category/role?
function quoteMatchesTarget(q, target) {
  if (target.type === 'role') return q.role === target.role;
  return !q.role && q.category === target.key;
}
function spanTargetIdx(pending, target) {
  return curDoc.ann.quotes.findIndex(q =>
    q.start === pending.start && q.end === pending.end && quoteMatchesTarget(q, target));
}
// Toggle a category for a span: add it (text as value) if absent, else remove it.
function toggleTarget(pending, target) {
  const i = spanTargetIdx(pending, target);
  if (i >= 0) removeQuote(i);
  else assignHighlight(pending, target, pending.text);
}

function showCategoryMenu(pending, rect) {
  closeCategoryMenu();
  const menu = document.createElement('div');
  menu.className = 'cat-menu';
  catMenuEl = menu;

  const title = document.createElement('div');
  title.className = 'cat-title';
  const snip = pending.text.length > 42 ? pending.text.slice(0, 42) + '…' : pending.text;
  title.textContent = `Tag “${snip}” (pick one or more):`;
  menu.appendChild(title);

  const groupOf = (label, buttons) => {
    const grp = document.createElement('div'); grp.className = 'cat-group';
    const lbl = document.createElement('div'); lbl.className = 'cat-group-label'; lbl.textContent = label;
    const btns = document.createElement('div'); btns.className = 'cat-btns';
    buttons.forEach(b => btns.appendChild(b));
    grp.appendChild(lbl); grp.appendChild(btns);
    return grp;
  };
  // A category chip: click the label to use the highlighted text as the value,
  // click the ▾ caret to pick an existing value from the dropdown instead.
  const catChip = (target, label, dot) => {
    const on = spanTargetIdx(pending, target) >= 0;
    const wrap = document.createElement('span'); wrap.className = 'cat-btn-wrap';
    const b = document.createElement('button'); b.className = 'cat-btn' + (on ? ' on' : '');
    b.innerHTML = `<span class="cat-check">${on ? '✓' : ''}</span>` +
      (dot ? `<span class="cat-dot" style="background:${dot}"></span>` : '') + label;
    // Toggle this category, then reopen the menu so more can be added to the same text.
    b.onclick = () => { toggleTarget(pending, target); showCategoryMenu(pending, rect); };
    wrap.appendChild(b);
    // Value picker only for multi-value tags (roles + multi fields). Free-text
    // fields like aftermath are justification-only — no value dropdown.
    const isTextField = target.type === 'field' && (field(target.key) || {}).type !== 'multi';
    if (!isTextField) {
      const caret = document.createElement('button');
      caret.className = 'cat-caret'; caret.textContent = '▾'; caret.title = 'Pick an existing value';
      caret.onclick = () => showValuePicker(pending, target, rect);
      wrap.appendChild(caret);
    }
    return wrap;
  };

  // Tags offered on highlight, in a fixed order mixing fields and roles — no
  // group titles, just one flat list.
  const TAG_ORDER = [
    { type: 'field', key: 'incident_system' },
    { type: 'field', key: 'incident_developer' },
    { type: 'role', role: 'actor' },
    { type: 'role', role: 'factor' },
    { type: 'role', role: 'harm' },
    { type: 'role', role: 'harmed_party' },
    { type: 'field', key: 'incident_aftermath' },
  ];
  const btns = document.createElement('div'); btns.className = 'cat-btns';
  TAG_ORDER.forEach(t => {
    if (t.type === 'role') {
      const r = ROLE[t.role];
      if (r) btns.appendChild(catChip({ type: 'role', role: t.role }, r.label, r.color));
    } else {
      const f = field(t.key);
      if (f) btns.appendChild(catChip({ type: 'field', key: t.key }, f.label, color[t.key]));
    }
  });
  menu.appendChild(btns);

  const done = document.createElement('button');
  done.className = 'cat-done'; done.textContent = 'Done';
  done.onclick = () => closeCategoryMenu();
  menu.appendChild(done);

  document.body.appendChild(menu);
  positionMenu(menu, rect);
  addOutsideClose(menu);
}

function positionMenu(menu, rect) {
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = rect.left, top = rect.bottom + 6;
  if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
  if (top + mh > window.innerHeight - 8) top = rect.top - mh - 6;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = Math.max(8, top) + 'px';
}
function addOutsideClose(menu) {
  setTimeout(() => {
    const onDown = (e) => { if (!e.target.closest('.cat-menu')) closeCategoryMenu(); };
    document.addEventListener('mousedown', onDown);
    menu._onDown = onDown;
  }, 0);
}

// A category's existing values: its schema options plus any already-selected values.
function valueOptions(target) {
  let opts = [], selected = [];
  if (target.type === 'role') {
    opts = roleOptions(target.role).slice();
    if (Array.isArray(curDoc.ann.roles[target.role])) selected = curDoc.ann.roles[target.role];
  } else {
    const f = field(target.key);
    opts = ((f && f.options) || []).slice();
    const fa = curDoc.ann.fields[target.key];
    if (fa && Array.isArray(fa.answer)) selected = fa.answer;
  }
  const seen = new Set(), out = [];
  [...opts, ...selected].forEach(v => { if (v && !seen.has(v)) { seen.add(v); out.push(v); } });
  return out;
}

// Second step of the highlight menu: pick which value the highlight pertains to.
function showValuePicker(pending, target, rect) {
  closeCategoryMenu();
  const menu = document.createElement('div');
  menu.className = 'cat-menu';
  catMenuEl = menu;

  const label = target.type === 'role'
    ? `${(ROLE[target.role] || {}).label}`
    : `${(field(target.key) || {}).label}`;
  const title = document.createElement('div');
  title.className = 'cat-title'; title.textContent = `${label} — which value?`;
  menu.appendChild(title);

  const list = document.createElement('div'); list.className = 'cat-vlist';
  const snip = pending.text.length > 30 ? pending.text.slice(0, 30) + '…' : pending.text;
  const useText = document.createElement('button');
  useText.className = 'cat-vopt cat-vopt-text';
  useText.textContent = `＋ Use “${snip}”`;
  useText.onclick = () => { assignHighlight(pending, target, pending.text); showCategoryMenu(pending, rect); };

  // Same grouping (and same collapsed-by-default behaviour) as the multiselect,
  // so a value sits in the same place whichever route you reach it by.
  const groups = target.type === 'role'
    ? roleGroups(target.role) : ((field(target.key) || {}).groups || null);
  const fillList = () => {
    list.innerHTML = '';
    list.appendChild(useText);
    groupedOptions(valueOptions(target), groups).forEach(section => {
      if (section.label) {
        list.appendChild(groupHeader(section, valueGroupsOpen, fillList, 0));
        if (!valueGroupsOpen.has(section.label)) return;
      }
      section.options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'cat-vopt' + (section.label ? ' in-group' : '');
        b.textContent = o;
        b.onclick = () => { assignHighlight(pending, target, o); showCategoryMenu(pending, rect); };
        list.appendChild(b);
      });
    });
  };
  fillList();
  menu.appendChild(list);

  const back = document.createElement('button');
  back.className = 'cat-back'; back.textContent = '← Back';
  back.onclick = () => showCategoryMenu(pending, rect);
  menu.appendChild(back);

  document.body.appendChild(menu);
  positionMenu(menu, rect);
  addOutsideClose(menu);
}

// Click a highlight to see every category covering that stretch of text; remove
// them one at a time, add more, or clear them all. Takes the clicked interval
// [a,b) and recomputes covering quotes fresh (robust to index shifts on remove).
function showSpanMenu(a, b, rect) {
  closeCategoryMenu();
  const items = curDoc.ann.quotes
    .map((q, idx) => ({ q, idx }))
    .filter(it => it.q.start <= a && it.q.end >= b);
  if (!items.length) return;
  const menu = document.createElement('div');
  menu.className = 'cat-menu';
  catMenuEl = menu;

  const text = items[0].q.text || '';
  const title = document.createElement('div');
  title.className = 'cat-title';
  const snip = text.length > 34 ? text.slice(0, 34) + '…' : text;
  title.textContent = `Categories on “${snip}”`;
  menu.appendChild(title);

  items.forEach(it => {
    const row = document.createElement('div'); row.className = 'span-row';
    const dot = document.createElement('span'); dot.className = 'cat-dot';
    dot.style.background = quoteColor(it.q);
    const name = document.createElement('span'); name.className = 'span-name';
    name.textContent = quoteLabel(it.q);
    const x = document.createElement('button'); x.className = 'span-x';
    x.textContent = '✕'; x.title = 'Remove this category';
    x.onclick = () => { removeQuote(it.idx); showSpanMenu(a, b, rect); };  // reopen with the rest
    row.appendChild(dot); row.appendChild(name); row.appendChild(x);
    menu.appendChild(row);
  });

  const add = document.createElement('button');
  add.className = 'cat-goto'; add.textContent = '＋ Add another category';
  add.onclick = () => showCategoryMenu({ start: items[0].q.start, end: items[0].q.end, text }, rect);
  menu.appendChild(add);

  const del = document.createElement('button');
  del.className = 'cat-del'; del.textContent = '✕ Remove all here';
  del.onclick = () => {
    curDoc.ann.quotes.map((q, idx) => ({ q, idx }))
      .filter(it => it.q.start <= a && it.q.end >= b)
      .map(it => it.idx).sort((x, y) => y - x)   // remove high indices first
      .forEach(idx => removeQuote(idx));
    closeCategoryMenu();
  };
  menu.appendChild(del);

  document.body.appendChild(menu);
  positionMenu(menu, rect);
  addOutsideClose(menu);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCategoryMenu(); });

// Drop a selected value from its field answer / claim role.
function removeValue(q) {
  if (q.role) {
    const arr = curDoc.ann.roles[q.role];
    if (Array.isArray(arr)) {
      const i = arr.indexOf(q.value);
      if (i >= 0) arr.splice(i, 1);
    }
  } else {
    const fa = curDoc.ann.fields[q.category];
    if (fa && Array.isArray(fa.answer)) {
      const i = fa.answer.indexOf(q.value);
      if (i >= 0) fa.answer.splice(i, 1);
    }
  }
}

function removeQuote(globalIdx) {
  const q = curDoc.ann.quotes[globalIdx];
  curDoc.ann.quotes.splice(globalIdx, 1);
  // If this was the last highlight justifying its selected value, drop the value too.
  if (q && q.value !== undefined) {
    const stillJustified = q.role
      ? curDoc.ann.quotes.some(x => x.role === q.role && x.value === q.value)
      : curDoc.ann.quotes.some(x => x.category === q.category && x.value === q.value);
    if (!stillJustified) {
      removeValue(q);
      if (armed && sameArm(q.role
        ? { type: 'role', role: q.role, value: q.value }
        : { type: 'field', key: q.category, value: q.value })) {
        armed = null;
        updateArmHint();
      }
    }
  }
  persist();
  renderArticle(true);
  if (q.role) renderRoles(); else renderCard(q.category);
}

// ---------- coding form ----------
function renderForm() {
  const root = document.getElementById('form');
  root.innerHTML = '';
  // Characteristics panel (flat actor/harm/factor/harmed-party) sits just above
  // the Incident aftermath card.
  SCHEMA.forEach(f => {
    if (f.key === 'incident_aftermath') root.appendChild(buildRolesPanel());
    root.appendChild(buildCard(f));
  });
  if (!SCHEMA.some(f => f.key === 'incident_aftermath')) root.appendChild(buildRolesPanel());
}

// rebuild a single card in place (keeps the rest of the form untouched)
function renderCard(key) {
  const old = document.querySelector(`.card[data-key="${key}"]`);
  if (old) old.replaceWith(buildCard(field(key)));
}

function subLabel(text) {
  const d = document.createElement('div'); d.className = 'sub'; d.textContent = text; return d;
}

function buildCard(f) {
  const isMulti = f.type === 'multi';
  const canJustify = f.justify !== false;
  const fieldArmed = !isMulti && canJustify && sameArm({ type: 'field', key: f.key, value: undefined });

  const card = document.createElement('div');
  card.className = 'card' + (fieldArmed ? ' armed' : '');
  card.dataset.key = f.key;

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = canJustify
    ? `<span class="sq" style="background:${color[f.key]}"></span>` +
      `<span class="label">${f.label}</span>` +
      // multiselects justify per selection, so no whole-field arm here
      (isMulti ? '' : `<span class="arm">${fieldArmed ? 'highlighting' : 'highlight'}</span>`)
    : `<span class="label">${f.label}</span>`;
  if (canJustify && !isMulti) head.onclick = () => armField(f.key, undefined);
  else head.style.cursor = 'default';
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'body';
  const fa = fieldAnn(f.key);

  if (f.key === 'incident_id') {
    body.appendChild(buildIncidentId(fa));
  } else if (!isMulti) {
    body.appendChild(buildText(fa, 'answer', false));
    if (canJustify) {
      body.appendChild(subLabel('Justification (highlighted quotes)'));
      body.appendChild(buildQuotes(f.key));
    }
  } else {
    // multiselect + per-selection justification
    if (!Array.isArray(fa.answer)) fa.answer = fa.answer ? [fa.answer] : [];
    const evBox = document.createElement('div');
    const refreshEv = () => {
      evBox.innerHTML = '';
      evBox.appendChild(buildValueEvidence(fa.answer, {
        color: color[f.key],
        armTarget: (v) => ({ type: 'field', key: f.key, value: v }),
        getQuotes: (v) => curDoc.ann.quotes.map((q, gi) => ({ q, gi }))
          .filter(x => x.q.category === f.key && x.q.value === v),
      }));
    };
    const select = buildSelect({
      options: f.options || [],
      groups: f.groups || null,
      selected: fa.answer,
      onChange: () => { persistSoon(); refreshEv(); },
      onRemoveValue: (v) => {
        curDoc.ann.quotes = curDoc.ann.quotes.filter(q => !(q.category === f.key && q.value === v));
        renderArticle(true);
      },
      onAdd: async (val) => {
        const res = await fetch('/api/schema/option', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ field: f.key, option: val }),
        });
        field(f.key).options = (await res.json()).options;
        return field(f.key).options;
      },
    });
    body.appendChild(select);
    body.appendChild(subLabel('Justification (highlight each selection)'));
    body.appendChild(evBox);
    refreshEv();
  }

  if (f.comments !== false) {
    body.appendChild(subLabel('Additional comments'));
    body.appendChild(buildText(fa, 'comments', true));
  }

  card.appendChild(body);
  return card;
}

// Per-selection justification: each selected value gets its own arm + highlights,
// and is flagged "needs evidence" until it has at least one highlight.
function buildValueEvidence(values, opts) {
  const wrap = document.createElement('div');
  wrap.className = 'value-ev';
  if (!values.length) {
    const none = document.createElement('div');
    none.className = 'ev-none'; none.textContent = 'No selections yet.';
    wrap.appendChild(none);
    return wrap;
  }
  values.forEach(v => {
    const t = opts.armTarget(v);
    const on = sameArm(t);
    const qs = opts.getQuotes(v);
    const row = document.createElement('div');
    row.className = 'ev-row' + (on ? ' armed' : '');
    row.dataset.arm = JSON.stringify(t);

    const head = document.createElement('div');
    head.className = 'ev-head';
    const flag = qs.length
      ? `<span class="ev-count">${qs.length} quote${qs.length === 1 ? '' : 's'}</span>`
      : `<span class="ev-warn">⚠ needs evidence</span>`;
    head.innerHTML =
      `<span class="ev-dot" style="background:${opts.color}"></span>` +
      `<span class="ev-val">${escapeHtml(v)}</span>` + flag +
      `<span class="ev-arm">${on ? 'highlighting' : 'highlight'}</span>`;
    head.querySelector('.ev-arm').onclick = () => setArm(t);
    row.appendChild(head);

    if (qs.length) {
      const q = document.createElement('div');
      q.className = 'quotes';
      qs.forEach(({ q: qq, gi }) => {
        const el = document.createElement('div');
        el.className = 'quote';
        el.style.borderLeftColor = opts.color;
        el.innerHTML = `“${escapeHtml(qq.text.slice(0, 180))}”<button class="x" title="Remove">×</button>`;
        el.onclick = (e) => { if (e.target.classList.contains('x')) return; scrollToMark(gi); };
        el.querySelector('.x').onclick = (e) => { e.stopPropagation(); removeQuote(gi); };
        q.appendChild(el);
      });
      row.appendChild(q);
    }
    wrap.appendChild(row);
  });
  return wrap;
}

// settable free text: type + Enter sets it to plain, settled text;
// click the text to edit, × to clear. For multiline, Shift+Enter adds a newline.
function buildText(fa, prop, multiline) {
  const wrap = document.createElement('div');

  function render(focus) {
    wrap.innerHTML = '';
    const val = typeof fa[prop] === 'string' ? fa[prop].trim() : '';
    const editing = wrap.dataset.editing === '1';

    if (val && !editing) {
      const box = document.createElement('div');
      box.className = 'text-answer';
      box.innerHTML = `<span class="val">${escapeHtml(val)}</span><button class="x" title="Clear">×</button>`;
      box.querySelector('.x').onclick = (e) => {
        e.stopPropagation();
        fa[prop] = ''; wrap.dataset.editing = ''; persist(); render(true);
      };
      box.onclick = (e) => {
